<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Central de Iluminação IoT</title>

    <!-- MQTT Paho -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            width: 100%;
            min-height: 100%;
        }


        body {

            width: 100%;
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: linear-gradient(
                135deg,
                #172033,
                #24344d
            );

            color: #1e293b;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 16px;

        }


        /* =====================================================
           CONTAINER PRINCIPAL
        ====================================================== */

        .dashboard {

            width: 100%;

            max-width: 760px;

            background: #ffffff;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.30);

            overflow: hidden;

        }


        /* =====================================================
           CABEÇALHO
        ====================================================== */

        .header {

            padding: 24px 28px;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 18px;

        }


        .header h1 {

            font-size: 21px;

            font-weight: 700;

        }


        .header p {

            margin-top: 5px;

            font-size: 13px;

            opacity: 0.9;

        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            background: rgba(255, 255, 255, 0.16);

            padding: 9px 13px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;

        }


        .status-dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #facc15;

            flex-shrink: 0;

        }


        .status-online .status-dot {

            background: #22c55e;

            box-shadow:
                0 0 0 4px
                rgba(34, 197, 94, 0.15);

        }


        .status-offline .status-dot {

            background: #ef4444;

            box-shadow:
                0 0 0 4px
                rgba(239, 68, 68, 0.15);

        }


        /* =====================================================
           CONTEÚDO
        ====================================================== */

        .content {

            padding: 28px;

        }


        /* =====================================================
           TÓPICO MQTT
        ====================================================== */

        .topic-section {

            margin-bottom: 24px;

        }


        .topic-label {

            display: block;

            margin-bottom: 8px;

            color: #475569;

            font-size: 12px;

            font-weight: 700;

        }


        .topic-input {

            width: 100%;

            min-height: 48px;

            padding: 12px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            background: #f8fafc;

            color: #334155;

            font-family: monospace;

            font-size: 14px;

            outline: none;

            -webkit-appearance: none;

        }


        .topic-input::placeholder {

            color: #94a3b8;

        }


        .topic-input:focus {

            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.10);

        }


        /* =====================================================
           ÁREA PRINCIPAL
        ====================================================== */

        .main-area {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

        }


        /* =====================================================
           PAINEL DO DISPOSITIVO
        ====================================================== */

        .device-panel {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 28px;

            text-align: center;

        }


        .device-title {

            color: #64748b;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            margin-bottom: 16px;

        }


        /* =====================================================
           LED
        ====================================================== */

        .led-area {

            display: flex;

            align-items: center;

            justify-content: center;

            height: 190px;

        }


        .led {

            width: 125px;

            height: 125px;

            border-radius: 50%;

            background: #cbd5e1;

            border: 8px solid #e2e8f0;

            box-shadow:
                inset 0 4px 10px
                rgba(0, 0, 0, 0.10);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            transition: 0.3s ease;

        }


        .led-text {

            color: #64748b;

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

        }


        /* =====================================================
           LED LIGADO
        ====================================================== */

        .led.active {

            background: #38bdf8;

            border-color: #bae6fd;

            box-shadow:

                0 0 0 8px
                rgba(56, 189, 248, 0.12),

                0 0 30px
                rgba(14, 165, 233, 0.55);

            transform: scale(1.04);

        }


        .led.active .led-text {

            color: white;

        }


        /* =====================================================
           PAINEL DE CONTROLE
        ====================================================== */

        .control-panel {

            border: 1px solid #e2e8f0;

            border-radius: 14px;

            padding: 28px;

        }


        .control-panel h2 {

            color: #1e3a8a;

            font-size: 18px;

            margin-bottom: 6px;

        }


        .control-description {

            color: #64748b;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 22px;

        }


        /* =====================================================
           BOTÕES
        ====================================================== */

        .buttons {

            display: grid;

            gap: 12px;

        }


        button {

            width: 100%;

            min-height: 50px;

            border: none;

            border-radius: 10px;

            padding: 14px;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

            -webkit-tap-highlight-color: transparent;

        }


        button:disabled {

            opacity: 0.45;

            cursor: not-allowed;

        }


        button:not(:disabled):active {

            transform: scale(0.97);

        }


        .btn-on {

            background: #16a34a;

        }


        .btn-off {

            background: #dc2626;

        }


        /* =====================================================
           MENSAGEM
        ====================================================== */

        .message {

            margin-top: 15px;

            padding: 12px;

            background: #eff6ff;

            border: 1px solid #dbeafe;

            border-radius: 9px;

            text-align: center;

            color: #1d4ed8;

            font-size: 12px;

            font-weight: 600;

            word-break: break-word;

        }


        /* =====================================================
           INFORMAÇÕES
        ====================================================== */

        .information {

            margin-top: 20px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

        }


        .info {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 10px;

            padding: 13px;

        }


        .info-title {

            color: #94a3b8;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

        }


        .info-value {

            margin-top: 5px;

            color: #334155;

            font-size: 12px;

            font-weight: 600;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        /* =====================================================
           RODAPÉ
        ====================================================== */

        .footer {

            margin-top: 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 10px;

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 650px) {

            body {

                align-items: flex-start;

                padding: 12px;

            }


            .dashboard {

                max-width: 100%;

                border-radius: 14px;

                margin: auto 0;

            }


            .header {

                padding: 20px;

                flex-direction: column;

                align-items: stretch;

                text-align: center;

            }


            .header h1 {

                font-size: 20px;

            }


            .header p {

                font-size: 12px;

            }


            .status {

                width: 100%;

            }


            .content {

                padding: 20px;

            }


            .main-area {

                grid-template-columns: 1fr;

                gap: 16px;

            }


            .device-panel {

                padding: 22px;

            }


            .control-panel {

                padding: 22px;

            }


            .information {

                grid-template-columns: 1fr 1fr;

            }


            .information .info:last-child {

                grid-column: 1 / -1;

            }

        }


        /* =====================================================
           CELULAR
        ====================================================== */

        @media (max-width: 480px) {

            body {

                padding: 8px;

            }


            .dashboard {

                border-radius: 12px;

            }


            .header {

                padding: 18px;

            }


            .header h1 {

                font-size: 18px;

            }


            .content {

                padding: 16px;

            }


            .topic-section {

                margin-bottom: 18px;

            }


            .topic-input {

                min-height: 50px;

                font-size: 14px;

            }


            .device-panel {

                padding: 20px 16px;

            }


            .control-panel {

                padding: 20px 16px;

            }


            .led-area {

                height: 165px;

            }


            .led {

                width: 115px;

                height: 115px;

            }


            .control-panel h2 {

                font-size: 17px;

            }


            .control-description {

                font-size: 12px;

            }


            button {

                min-height: 54px;

                font-size: 14px;

            }


            .information {

                grid-template-columns: 1fr;

            }


            .information .info:last-child {

                grid-column: auto;

            }


            .info {

                padding: 12px;

            }

        }


        /* =====================================================
           CELULARES MUITO PEQUENOS
        ====================================================== */

        @media (max-width: 350px) {

            .header h1 {

                font-size: 17px;

            }


            .content {

                padding: 13px;

            }


            .led {

                width: 100px;

                height: 100px;

            }


            .led-area {

                height: 145px;

            }

        }

    </style>

</head>


<body>


    <main class="dashboard">


        <!-- =================================================
             CABEÇALHO
        ================================================== -->

        <header class="header">

            <div>

                <h1>
                    Central de Iluminação IoT
                </h1>

                <p>
                    Controle da porta 13 do Arduino
                </p>

            </div>


            <div
                id="status"
                class="status"
            >

                <span class="status-dot"></span>

                <span id="statusText">
                    Sincronizando...
                </span>

            </div>

        </header>


        <section class="content">


            <!-- =================================================
                 TÓPICO MQTT
            ================================================== -->

            <div class="topic-section">

                <label
                    class="topic-label"
                    for="topicInput"
                >

                    Tópico MQTT

                </label>


                <input
                    id="topicInput"
                    class="topic-input"
                    type="text"
                    placeholder="Digite o tópico MQTT"
                    autocomplete="off"
                    spellcheck="false"
                >

            </div>


            <!-- =================================================
                 ÁREA PRINCIPAL
            ================================================== -->

            <div class="main-area">


                <!-- =================================================
                     DISPOSITIVO
                ================================================== -->

                <section class="device-panel">


                    <div class="device-title">

                        Estado da porta 13

                    </div>


                    <div class="led-area">


                        <div
                            id="led"
                            class="led"
                        >

                            <span
                                id="ledText"
                                class="led-text"
                            >

                                Desligado

                            </span>

                        </div>


                    </div>


                </section>


                <!-- =================================================
                     CONTROLE
                ================================================== -->

                <section class="control-panel">


                    <h2>
                        Controle
                    </h2>


                    <p class="control-description">

                        Envie um comando para o Arduino
                        através do protocolo MQTT.

                    </p>


                    <div class="buttons">


                        <button
                            id="btnOn"
                            class="btn-on"
                            disabled
                        >

                            LIGAR

                        </button>


                        <button
                            id="btnOff"
                            class="btn-off"
                            disabled
                        >

                            DESLIGAR

                        </button>


                    </div>


                    <div class="message">

                        Última mensagem:

                        <span id="lastMessage">
                            Aguardando
                        </span>

                    </div>


                </section>


            </div>


            <!-- =================================================
                 INFORMAÇÕES
            ================================================== -->

            <div class="information">


                <div class="info">

                    <div class="info-title">
                        Broker
                    </div>

                    <div class="info-value">
                        broker.hivemq.com
                    </div>

                </div>


                <div class="info">

                    <div class="info-title">
                        Conexão
                    </div>

                    <div class="info-value">
                        WebSocket SSL
                    </div>

                </div>


                <div class="info">

                    <div class="info-title">
                        Porta
                    </div>

                    <div class="info-value">
                        Arduino D13
                    </div>

                </div>


            </div>


            <footer class="footer">

                MQTT • HiveMQ • Arduino • IoT

            </footer>


        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           CONFIGURAÇÃO MQTT
        ====================================================== */

        const MQTT_HOST =
            "broker.hivemq.com";


        const MQTT_PORT =
            8884;


        /*
         * Começa vazio.
         * O usuário digita o tópico.
         */

        let currentTopic = "";


        /* =====================================================
           CLIENT ID
        ====================================================== */

        const clientId =

            "arduino_dashboard_" +

            Math.random()
                .toString(16)
                .substring(2, 10) +

            "_" +

            Date.now();


        /* =====================================================
           ELEMENTOS
        ====================================================== */

        const status =
            document.getElementById(
                "status"
            );


        const statusText =
            document.getElementById(
                "statusText"
            );


        const topicInput =
            document.getElementById(
                "topicInput"
            );


        const led =
            document.getElementById(
                "led"
            );


        const ledText =
            document.getElementById(
                "ledText"
            );


        const btnOn =
            document.getElementById(
                "btnOn"
            );


        const btnOff =
            document.getElementById(
                "btnOff"
            );


        const lastMessage =
            document.getElementById(
                "lastMessage"
            );


        /* =====================================================
           CLIENTE PAHO MQTT
        ====================================================== */

        const client =

            new Paho.MQTT.Client(

                MQTT_HOST,

                MQTT_PORT,

                "/mqtt",

                clientId

            );


        /* =====================================================
           STATUS
        ====================================================== */

        function setStatus(
            type,
            text
        ) {

            status.className =
                "status";


            if (
                type === "online"
            ) {

                status.classList.add(
                    "status-online"
                );

            }


            if (
                type === "offline"
            ) {

                status.classList.add(
                    "status-offline"
                );

            }


            statusText.textContent =
                text;

        }


        /* =====================================================
           CONEXÃO PERDIDA
        ====================================================== */

        client.onConnectionLost =

            function (
                responseObject
            ) {


                btnOn.disabled = true;

                btnOff.disabled = true;


                setStatus(
                    "offline",
                    "Sistema Offline"
                );


                if (
                    responseObject.errorCode !== 0
                ) {

                    console.log(

                        "Conexão perdida:",
                        responseObject.errorMessage

                    );

                }

            };


        /* =====================================================
           MENSAGEM RECEBIDA
        ====================================================== */

        client.onMessageArrived =

            function (
                message
            ) {


                const received =

                    message
                        .payloadString
                        .trim();


                console.log(
                    "Mensagem recebida:",
                    received
                );


                lastMessage.textContent =
                    received;


                /*
                 * RECEBEU 1
                 */

                if (
                    received === "1"
                ) {

                    led.classList.add(
                        "active"
                    );


                    ledText.textContent =
                        "Ligado";

                }


                /*
                 * RECEBEU 0
                 */

                else if (
                    received === "0"
                ) {

                    led.classList.remove(
                        "active"
                    );


                    ledText.textContent =
                        "Desligado";

                }

            };


        /* =====================================================
           CONECTAR
        ====================================================== */

        function connectMQTT() {


            setStatus(
                "sync",
                "Conectando..."
            );


            client.connect({

                useSSL: true,

                timeout: 10,


                onSuccess:
                    function () {


                        console.log(
                            "Conectado ao HiveMQ"
                        );


                        setStatus(
                            "online",
                            "Sistema Online"
                        );


                        /*
                         * Os botões só ficam disponíveis
                         * quando existe um tópico.
                         */

                        updateButtons();


                        /*
                         * Se o usuário já digitou
                         * um tópico, assinar.
                         */

                        if (
                            currentTopic !== ""
                        ) {

                            subscribeTopic();

                        }

                    },


                onFailure:
                    function (
                        error
                    ) {


                        console.error(
                            "Erro MQTT:",
                            error
                        );


                        setStatus(
                            "offline",
                            "Falha na conexão"
                        );


                        btnOn.disabled = true;

                        btnOff.disabled = true;

                    }

            });

        }


        /* =====================================================
           ATUALIZAR BOTÕES
        ====================================================== */

        function updateButtons() {


            const connected =
                client.isConnected();


            const hasTopic =
                currentTopic.trim() !== "";


            const enabled =
                connected &&
                hasTopic;


            btnOn.disabled =
                !enabled;


            btnOff.disabled =
                !enabled;

        }


        /* =====================================================
           ASSINAR TÓPICO
        ====================================================== */

        function subscribeTopic() {


            if (
                !client.isConnected()
            ) {

                return;

            }


            if (
                currentTopic.trim() === ""
            ) {

                return;

            }


            client.subscribe(

                currentTopic,

                {

                    qos: 0,


                    onSuccess:
                        function () {

                            console.log(

                                "Inscrito em:",
                                currentTopic

                            );

                            updateButtons();

                        },


                    onFailure:
                        function (
                            error
                        ) {

                            console.error(

                                "Erro ao assinar tópico:",
                                error

                            );

                        }

                }

            );

        }


        /* =====================================================
           PUBLICAR COMANDO
        ====================================================== */

        function publishCommand(
            value
        ) {


            if (
                !client.isConnected()
            ) {

                return;

            }


            if (
                currentTopic.trim() === ""
            ) {

                alert(
                    "Digite o tópico MQTT primeiro."
                );

                topicInput.focus();

                return;

            }


            const message =

                new Paho.MQTT.Message(
                    String(value)
                );


            message.destinationName =
                currentTopic;


            message.qos = 0;


            message.retained = false;


            client.send(message);


            console.log(
                "Comando enviado:",
                value
            );


            /*
             * IMPORTANTE:
             *
             * O LED NÃO muda aqui.
             *
             * Ele só muda quando a mensagem
             * for recebida pelo MQTT.
             */

        }


        /* =====================================================
           BOTÃO LIGAR
        ====================================================== */

        btnOn.addEventListener(

            "click",

            function () {

                publishCommand("1");

            }

        );


        /* =====================================================
           BOTÃO DESLIGAR
        ====================================================== */

        btnOff.addEventListener(

            "click",

            function () {

                publishCommand("0");

            }

        );


        /* =====================================================
           ALTERAR TÓPICO
        ====================================================== */

        topicInput.addEventListener(

            "change",

            function () {


                const newTopic =

                    topicInput
                        .value
                        .trim();


                /*
                 * Se estiver vazio
                 */

                if (
                    newTopic === ""
                ) {

                    currentTopic = "";

                    updateButtons();

                    return;

                }


                /*
                 * Se não estiver conectado,
                 * apenas salva o tópico.
                 */

                if (
                    !client.isConnected()
                ) {

                    currentTopic =
                        newTopic;

                    updateButtons();

                    return;

                }


                const oldTopic =
                    currentTopic;


                currentTopic =
                    newTopic;


                /*
                 * Se existia um tópico anterior,
                 * cancelar inscrição.
                 */

                if (
                    oldTopic !== ""
                ) {

                    client.unsubscribe(

                        oldTopic,

                        {

                            onSuccess:
                                function () {

                                    subscribeTopic();

                                },

                            onFailure:
                                function (
                                    error
                                ) {

                                    console.error(
                                        error
                                    );

                                    subscribeTopic();

                                }

                        }

                    );

                }

                else {

                    subscribeTopic();

                }


                updateButtons();

            }

        );


        /* =====================================================
           TAMBÉM ATUALIZAR AO DIGITAR
        ====================================================== */

        topicInput.addEventListener(

            "input",

            function () {

                currentTopic =
                    topicInput.value.trim();

                updateButtons();

            }

        );


        /* =====================================================
           INICIAR SISTEMA
        ====================================================== */

        connectMQTT();


    </script>


</body>

</html>
